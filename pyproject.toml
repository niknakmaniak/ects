[project]
name = "ects"
version = "0.1.0"
description = "ECTS — transformation automatique de séances de cours"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "python-docx>=1.1.2",
    "pypdf>=5.1.0",
    "python-pptx>=1.0.2",
    "google-api-python-client>=2.154.0",
    "google-auth>=2.36.0",
    "GitPython>=3.1.43",
    "openai>=1.57.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
gpu = ["faster-whisper>=1.1.0", "torch>=2.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
